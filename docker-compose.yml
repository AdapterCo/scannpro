# ScannPro na VPS: um container (painel + serviço de pagamento), atrás do Traefik (rede traefik9),
# em https://scannpro.adapterco.com.br
#
# Antes de subir: o ARQUIVO da chave do Firebase precisa existir em servico/firebase-admin.json
#   docker compose up -d --build

services:
  scannpro:
    build: .
    image: scannpro
    container_name: scannpro
    restart: unless-stopped
    environment:
      URL_PUBLICA: https://scannpro.adapterco.com.br
      FIREBASE_CHAVE: /run/secrets/firebase-admin.json
      FIREBASE_PROJECT_ID: adapterdb-aba6f
      FIREBASE_DATABASE_URL: https://adapterdb-aba6f-default-rtdb.firebaseio.com
      PIX_VALIDADE_MIN: 31
      PIX_EMAIL_PAGADOR: pagador@adapterco.com.br
      PIX_DESCRICAO: Sessão ScannPro
      CONCILIACAO_S: 20
    volumes:
      - ./servico/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik9"
      - "traefik.http.routers.scannpro.rule=Host(`scannpro.adapterco.com.br`)"
      - "traefik.http.routers.scannpro.entrypoints=https"
      - "traefik.http.routers.scannpro.tls=true"
      - "traefik.http.routers.scannpro.tls.certresolver=letsencrypt"
      - "traefik.http.services.scannpro.loadbalancer.server.port=8787"

networks:
  traefik:
    external: true
    name: traefik9
